            例如付款天数、使用次数、退款条件等，

            只要用户明确指定历史时间，也必须优先进入 Historical。


            第三优先级：Current

            只有在：

            - 用户明确说现在、当前、现行、最新版；

            或

            - 用户没有给出任何历史时间限定，

            才选择 Current。


            用户明确询问产品A过去、历史、旧版、老版本或特定历史时期的退款规则、取消规则、订阅规则或产品政策。


            出现以下语义时优先判断为 Historical：

            - 以前

            - 之前

            - 过去

            - 旧版

            - 老版本

            - 历史

            - 当时

            - 某个过去年份，如2025年

            - V1.0

            - 旧退款规则

            - 旧制度

            - 以前怎么规定


            例如：

            “旧版产品A退款规则是多少天？”

            “2025年产品A退款规则是什么？”

            “以前产品A付款几天内可以退款？”

            “产品A V1.0退款条件是什么？”

            “2025年产品A退款规则是多少天？”

            “2025年产品A付款5天但已经使用核心功能，可以退款吗？”


            若用户明确要求与当前版本进行比较，不属于 Historical，应进入 Comparison。'
