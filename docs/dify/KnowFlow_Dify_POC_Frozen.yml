    - data:
        classes:
        - id: '1'
          label: Current
          name: '【版本判定优先级】


            必须按以下顺序判断：


            第一优先级：Comparison

            如果用户明确要求比较当前与历史、新版与旧版、现在与以前的差异，

            无论问题中是否出现“现在”“旧版”“2025”等词，都选择 Comparison。


            第二优先级：Historical

            如果用户明确给出了过去的年份、日期或历史时间范围，

            并且问题不是版本比较，则选择 Historical。


            历史时间表达包括但不限于：

            - 2025年

            - 去年

            - 当时

            - 以前

            - 旧版

            - 历史规则

            - 某个已经过去的具体日期


            即使问题中还包含具体业务条件，

            例如付款天数、使用次数、退款条件等，

            只要用户明确指定历史时间，也必须优先进入 Historical。


            第三优先级：Current

            只有在：

            - 用户明确说现在、当前、现行、最新版；

            或

            - 用户没有给出任何历史时间限定，

            才选择 Current。


            用户询问产品A当前、现在、现行、最新、生效中的退款规则、取消规则、订阅规则或产品政策。


            以下情况默认判断为 Current：

            - 没有明确说明历史时间

            - 出现“现在”

            - “目前”

            - “当前”

            - “最新”

            - “现行”

            - “现在退款规则”

            - “现在还能不能退”

            - 普通产品规则问题没有历史语义


            例如：

            “现在产品A退款规则是多少天？”

            “产品A付款10天后还能退款吗？”

            “现在产品A使用2次还能申请退款吗？”

            “产品A当前退款条件是什么？”

            “现在产品A退款规则是多少？”


            反例：

            “产品A付款10天，核心付费功能用了2次，可以退款吗？”


            若用户明确要求与旧版、历史版本进行比较，不属于 Current，应进入 Comparison。'
        - id: '2'
          label: Historical
          name: '【版本判定优先级】


