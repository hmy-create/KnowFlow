app:
  description: '面向企业内部制度、SOP、产品规则与FAQ的可信知识问答助手，

    支持版本感知、权限感知、置信度分流与引用溯源。'
  icon: female-office-worker
  icon_background: '#E0F2FE'
  icon_type: emoji
  mode: advanced-chat
  name: KnowFlow · 企业知识可信问答Agent
  use_icon_as_answer_icon: false
