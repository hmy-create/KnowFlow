    - data:
        classes:
        - id: '1'
          label: Current
          name: '用户询问当前、现在、现行、最新、生效中的财务制度、差旅规则、报销规则、费用规则。


            用户询问当前、现在、现行、最新规则，

            或明确日期落在当前生效版本的有效期间内。


            以下情况也默认属于 Current：

            - 没有明确说明时间

            - “现在”

            - “目前”

            - “当前”

            - “最新”

            - “现行”

            - “现在规定”

            - 普通问题没有历史语义


            例如：

            “现在一线城市住宿标准是多少？”

            “电子发票可以报销吗？”

            “出差回来多久要报销？”

            “2026年5月1日一线城市住宿标准是多少？”'
        - id: '2'
          label: Historical
          name: '用户明确询问过去、历史、旧版或特定历史时间的财务制度。


            1. 用户明确询问过去、以前、旧版、历史规则；

            2. 用户提供了明确历史日期，且该日期早于当前版本生效日期；

            3. 查询日期落在已失效版本的有效期间内；

            4. 不能仅根据“年份较近”判断为 Current，必须结合问题中的具体日期判断。


            出现以下语义优先判断为 Historical：

            - 以前

            - 之前

            - 过去

            - 旧版

            - 老版本

            - 历史

            - 当时

            - 某个过去年份，如2025年、2024年

            - V1.0、V2.0等明确旧版本

            - “以前规定”

            - “旧制度”


            例如：

            “2025年一线城市住宿标准是多少？”

            “以前出差多久内报销？”

            “旧版差旅制度怎么规定？”

            “2026年4月30日一线城市住宿标准是多少？” '
